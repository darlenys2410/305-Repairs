<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#0b6bcb;--ln:#e3e6ea;--dn:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#1a2027;--tx:#eef1f4;--mut:#9aa4b0;--ac:#5aa9ff;--ln:#2b333c;--dn:#ff6b6b}}
:root[data-theme="dark"]{--bg:#101418;--card:#1a2027;--tx:#eef1f4;--mut:#9aa4b0;--ac:#5aa9ff;--ln:#2b333c;--dn:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 80px}
h1{font-size:1.4rem;margin:.4rem 0 .6rem}h2{font-size:1.05rem;margin:1.2rem 0 .2rem}h3{font-size:.9rem;color:var(--mut);margin:.7rem 0 .3rem}
.mut{color:var(--mut)}a{color:var(--ac)}.hd{display:flex;align-items:center;gap:12px;margin:.2rem 0 .8rem}.hd img{height:54px;width:auto;background:#fff;border-radius:10px;padding:4px}.hd b{font-size:1.05rem}input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0}.chk{display:flex;align-items:center;margin:.5rem 0;color:var(--tx);font-size:.9rem}
button{font:inherit;padding:.7rem 1rem;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.lnk{border:0;background:none;color:var(--ac);padding:.4rem 0}
button.dn{color:var(--dn)}
.row{display:flex;gap:8px;margin:.6rem 0}.row>button{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:.6rem 0}
.chip{padding:.4rem .8rem;border-radius:99px}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
label{display:block;margin:.7rem 0 0;font-size:.85rem;color:var(--mut)}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:.7rem;font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
#q{margin:.7rem 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:.7rem .9rem;margin:.4rem 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:.6rem}
figure{margin:0;position:relative}
figure img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--ln)}
figcaption{font-size:.7rem;color:var(--mut);margin-top:2px}
.ov{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.94);display:flex;flex-direction:column;justify-content:center;padding:12px}
.ov img{max-width:100%;max-height:75%;object-fit:contain;margin:auto}.ov .row{flex-wrap:wrap}.ov .row>button{flex:1 1 40%}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:10;display:none;max-width:90%}

    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x800,true);e.setUint16(12,tm,true);e.setUint16(14,dt,true);e.setUint32(16,c,true);e.setUint32(20,z,true);e.setUint32(24,z,true);e.setUint16(28,n.length,true);e.setUint32(42,off,true);
    P.push(h.buffer,n,f.data);C.push(e.buffer,n);off+=30+n.length+z;cs+=46+n.length;
  }
  const t=new DataView(new ArrayBuffer(22));
  t.setUint32(0,0x06054b50,true);t.setUint16(8,fs.length,true);t.setUint16(10,fs.length,true);t.setUint32(12,cs,true);t.setUint32(16,off,true);
  return new Blob([...P,...C,t.buffer],{type:'application/zip'});
}
const safe=s=>String(s).replace(/[\\/:*?"<>|\s]+/g,'-').replace(/^-+|-+$/g,'');
const fname=r=>safe([r.cliente,r.tienda&&'Tienda '+r.tienda,r.unidad&&'Unidad '+r.unidad,(r.fecha||'').replace('T',' ').replace(':','')].filter(Boolean).join(' '))||'Reparacion';
const ext=b=>/png/.test(b.type)?'png':/webp/.test(b.type)?'webp':'jpg';
const pnm=(r,i,b)=>fname(r)+'_'+(i+1)+'-'+safe(r.fotos[i].tipo)+'.'+ext(b);
const infoTxt=r=>['Cliente: '+(r.cliente||'-'),'Tienda: '+(r.tienda||'-'),'Unidad: '+(r.unidad||'-'),'Mecánico: '+(r.mecanico||'-'),'Fecha y hora: '+fmt(r.fecha),'Localización: '+(r.localizacion||'-'),r.coords?'GPS: https://www.google.com/maps?q='+r.coords.lat+','+r.coords.lng:'','Notas: '+(r.notas||'-')].filter(Boolean).join('\n');
const getBlob=async p=>{const x=await fetch('/_blob/'+p.id);if(!x.ok)throw new Error('foto');return x.blob()};
async function saveFile(name,data){
  const dl=await claude.use('downloads');
  if(!dl){toast(t('download_not_available'));return}
  try{await dl.save({filename:name,data})}
  catch(e){if(e.code!=='declined')toast(t('download_failed')+(e.code||e.message))}
}
async function zipDl(btn,selected){
  const r=byId(view.id),lab=btn.textContent,root=fname(r),fotos=selected?r.fotos.filter((_,i)=>selected.includes(i)):r.fotos;btn.textContent=t('prepare');
  try{
    const fs=[{name:root+'/info.txt',data:new TextEncoder().encode(infoTxt(r))}];
    for(let i=0;i<fotos.length;i++){const idx=r.fotos.indexOf(fotos[i]);const b=await getBlob(fotos[i]);fs.push({name:root+'/'+(idx+1)+'-'+safe(fotos[i].tipo)+'.'+ext(b),data:new Uint8Array(await b.arrayBuffer())})}
    await saveFile(root+'.zip',zip(fs));
  }catch(e){toast('No se pudo crear el archivo.')}
  btn.textContent=lab;
}
async function dlFoto(i,btn){
  const r=byId(view.id),lab=btn.textContent;btn.textContent='…';
  try{const b=await getBlob(r.fotos[i]);await saveFile(pnm(r,i,b),b)}catch(e){toast('No se pudo descargar la foto.')}
  btn.textContent=lab;
}
let pend=null,shareOff=false;
async function share(idxs,btn){
  const r=byId(view.id),k=r.id+idxs.join(),lab=btn.dataset.l||(btn.dataset.l=btn.textContent);
  const alt=async()=>{pend=null;btn.textContent=lab;if(idxs.length===1)await dlFoto(idxs[0],btn);else await zipDl(btn)};
  const go=async d=>{
    try{await navigator.share(d);btn.textContent=lab;pend=null}
    catch(e){
      if(e.name==='AbortError'){btn.textContent=lab;pend=null;return}
      if(e.name==='NotAllowedError'&&!(pend&&pend.k===k)){pend={k,d};btn.textContent=t('ready_to_send');return}
      shareOff=true;await alt();
    }
  };
  if(pend&&pend.k===k)return go(pend.d);
  if(shareOff||!(navigator.share&&navigator.canShare))return alt();
  btn.textContent=t('prepare');
  try{
    const files=[];
    for(const i of idxs){const b=await getBlob(r.fotos[i]);files.push(new File([b],pnm(r,i,b),{type:b.type||'image/jpeg'}))}
    if(!navigator.canShare({files}))return alt();
    await go({files,title:ttl(r),text:infoTxt(r)});
  }catch(e){btn.textContent=lab;toast(t('cannot_prepare'))}
}

const bakV=()=>{
  const last=(bak&&bak.t)||'';let n=0;const F=new Set();

  +'<p class="mut">Las fotos ya se guardan en la app. El respaldo es una copia extra en archivos ZIP que guardas tú (en Archivos, iCloud o Drive).</p>'

  +'<div class="row"><button class="pri" data-a="bak"'+(bkbusy?' disabled':'')+'>💾 Respaldar lo nuevo</button><button data-a="bakall"'+(bkbusy?' disabled':'')+'>Respaldar todo</button></div>'
  +'<div id="bkmsg" class="mut">'+esc(bkmsg)+'</div>';
};
const setBk=t=>{bkmsg=t;const e=$('#bkmsg');if(e)e.textContent=t};
async function runBak(todo){
  if(bkbusy)return;
  const last=todo?'':(bak&&bak.t)||'',items=[];
  repairs.forEach(r=>(r.fotos||[]).forEach((p,i)=>{if(!last||(p.u||p.t||'')>last)items.push([r,i])}));
  if(!items.length){toast('No hay fotos nuevas para respaldar');return}
  const dl=await claude.use('downloads');
  if(!dl){toast(t('download_not_available'));return}
  const start=new Date().toISOString(),day=start.slice(0,10),en=new TextEncoder(),fold=new Set();
  let fs=[],size=0,part=0,seen=new Set(),ok=true;bkbusy=true;render(true);
  const flush=async()=>{
    if(!fs.length)return true;
    part++;setBk('Parte '+part+' lista: confirma para guardar el archivo.');
    try{await dl.save({filename:'Respaldo-305-'+day+'-parte'+part+'.zip',data:zip(fs)});fs=[];size=0;seen=new Set();return true}
    catch(e){if(e.code!=='declined')toast('No se pudo guardar el respaldo: '+(e.code||e.message));return false}
  };
  try{
    for(let k=0;k<items.length&&ok;k++){
      const [r,i]=items[k],p=r.fotos[i],root=fname(r);
      setBk('Preparando foto '+(k+1)+' de '+items.length+'…');
      const b=await getBlob(p),u=new Uint8Array(await b.arrayBuffer());
      if(!seen.has(r.id)){seen.add(r.id);fold.add(r.id);fs.push({name:root+'/info.txt',data:en.encode(infoTxt(r))})}
      fs.push({name:root+'/'+(i+1)+'-'+safe(p.tipo)+'.'+ext(b),data:u});size+=u.length;
      if(size>50e6)ok=await flush();
    }
    if(ok)ok=await flush();
    if(ok){localStorage.setItem('meta_backup',JSON.stringify({t:start,fotos:items.length,carpetas:fold.size}));setBk('Listo: '+items.length+' fotos respaldadas. Revisa que los ZIP estén en Archivos.')}
    else setBk('Respaldo interrumpido. No se marcó como completado.');
  }catch(e){setBk('Error: '+(e.code||e.message))}
  bkbusy=false;if(view.n==='bak')render(true);
}
async function shrink(file){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(file)).catch(()=>null);
  if(!bmp)return file;
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82));
}
async function create(){
  const v=k=>$('#f_'+k).value.trim();
  ;

async function addPhotos(files,fromCam){
  const id=view.id;
  for(let i=0;i<files.length;i++){
    busy='Subiendo '+(i+1)+' de '+files.length+'…';const b0=$('#busy');if(b0)b0.textContent=busy;
    try{
      const b=await shrink(files[i]);
      const a=await assets.upload(b,{type:b.type||'image/jpeg'});
      const r=byId(id);
      const fotos=(r.fotos||[]).concat([{id:a.id,tipo,t:fromCam?new Date().toISOString():new Date(files[i].lastModified||Date.now()).toISOString(),u:new Date().toISOString()}]);
      const r=JSON.parse(localStorage.getItem('repair_'+id)||'{}');r.fotos=fotos;localStorage.setItem('repair_'+id,JSON.stringify(r));if(gal&&fromCam)saveFile(fname(r)+'_'+fotos.length+'-'+safe(tipo)+'.'+ext(b),b);
      r.fotos=fotos;
      if(view.id===id)render();
    }catch(e){toast('Error al subir: '+(e.code||e.message))}
  }
  busy='';if(view.id===id)render();
}
